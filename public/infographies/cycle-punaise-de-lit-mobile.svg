<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2150" width="900" height="2150" role="img" aria-labelledby="tv dv">
<title id="tv">Cycle de vie de la punaise de lit : de l'œuf à l'adulte</title>
<desc id="dv">Œuf d'environ 1 mm qui éclot en 7 à 15 jours, 5 stades larvaires de 1,5 à 4,5 mm durant chacun 3 à 15 jours avec un repas de sang avant chaque mue, adulte de 5 à 7 mm qui vit 6 à 24 mois.</desc>
