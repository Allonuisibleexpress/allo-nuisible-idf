<text x="450" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#E8441A" text-anchor="middle">punaise de lit</text>
<text x="450" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#bbb" text-anchor="middle">7 étapes, un repas de sang avant chaque mue</text>
