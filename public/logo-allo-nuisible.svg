<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 545" width="500" height="545">
  <defs>
    <clipPath id="mainClip">
      <circle cx="250" cy="232" r="190"/>
    </clipPath>
    <!-- Top arc for "ALLO" text - inside the circle top -->
    <path id="topArc" d="M 68,232 A 182,182 0 0 1 432,232"/>
    <!-- Bottom arc for "NUISIBLE" text - inside the circle bottom -->
    <path id="bottomArc" d="M 76,232 A 174,174 0 0 0 424,232"/>
    <!-- Tagline arc below the badge -->
    <path id="tagArc" d="M 42,480 A 228,228 0 0 0 458,480"/>
  </defs>

  <!-- ── DROP SHADOW ── -->
  <ellipse cx="254" cy="242" rx="210" ry="210" fill="rgba(0,0,0,0.18)"/>

  <!-- ── OUTER BADGE CIRCLE (white sticker) ── -->
  <circle cx="250" cy="232" r="204" fill="white" stroke="#111" stroke-width="14"/>

  <!-- ── ORANGE PROHIBITION RING + BACKGROUND ── -->
  <!-- Full orange inner circle -->
  <circle cx="250" cy="232" r="188" fill="#E8441A" clip-path="url(#mainClip)"/>
  <!-- White center circle (creating orange ring) -->
  <circle cx="250" cy="232" r="148" fill="white"/>

  <!-- ── ORANGE DIAGONAL BAND ── -->
  <g clip-path="url(#mainClip)">
    <rect x="203" y="30" width="80" height="410" rx="0" fill="#E8441A" transform="rotate(-28 250 232)"/>
  </g>

  <!-- ── CHARACTERS (inside the white center) ── -->
  <g clip-path="url(#mainClip)">

    <!-- ═══ RAT (left) - front-facing menacing ═══ -->
    <!-- Tail -->
    <path d="M 182 358 Q 148 395 162 428 Q 172 450 148 462"
          stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="172" cy="296" rx="50" ry="62" fill="white" stroke="#111" stroke-width="5"/>
    <!-- Left arm -->
    <path d="M 125 273 Q 96 308 112 342" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Right arm -->
    <path d="M 219 273 Q 248 308 232 342" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Left claws -->
    <path d="M 112 342 Q 98 353 93 361" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 112 342 Q 106 355 104 365" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 112 342 Q 118 354 118 364" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Right claws -->
    <path d="M 232 342 Q 246 353 251 361" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 232 342 Q 238 355 240 365" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 232 342 Q 226 354 226 364" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="156" y="243" width="32" height="18" rx="8" fill="white" stroke="#111" stroke-width="4"/>
    <!-- Head -->
    <circle cx="172" cy="210" r="52" fill="white" stroke="#111" stroke-width="5"/>
    <!-- Left ear (pointed, large) -->
    <ellipse cx="136" cy="170" rx="22" ry="32" transform="rotate(-18,136,170)" fill="white" stroke="#111" stroke-width="5"/>
    <ellipse cx="136" cy="170" rx="13" ry="20" transform="rotate(-18,136,170)" fill="#f8b0b0"/>
    <!-- Right ear (pointed, large) -->
    <ellipse cx="208" cy="170" rx="22" ry="32" transform="rotate(18,208,170)" fill="white" stroke="#111" stroke-width="5"/>
    <ellipse cx="208" cy="170" rx="13" ry="20" transform="rotate(18,208,170)" fill="#f8b0b0"/>
    <!-- Muzzle -->
    <ellipse cx="172" cy="228" rx="27" ry="19" fill="#ececec" stroke="#111" stroke-width="4"/>
    <!-- Nose -->
    <ellipse cx="172" cy="220" rx="9" ry="7" fill="#111"/>
    <!-- Nostril dots -->
    <circle cx="168" cy="221" r="2.5" fill="white"/>
    <circle cx="176" cy="221" r="2.5" fill="white"/>
    <!-- Left eye (big, menacing) -->
    <circle cx="154" cy="207" r="15" fill="#111"/>
    <circle cx="158" cy="202" r="5" fill="white"/>
    <!-- Right eye -->
    <circle cx="191" cy="207" r="15" fill="#111"/>
    <circle cx="195" cy="202" r="5" fill="white"/>
    <!-- Left menacing brow -->
    <path d="M 136 191 Q 147 185 162 192" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Right menacing brow -->
    <path d="M 208 191 Q 197 185 182 192" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Teeth (jagged, menacing) -->
    <path d="M 157 240 L 157 250 L 165 242 L 165 252 L 172 244 L 172 252 L 179 242 L 179 250 L 187 240"
          stroke="#111" stroke-width="3" fill="white" stroke-linejoin="round"/>
    <!-- Whiskers left -->
    <line x1="145" y1="226" x2="105" y2="218" stroke="#111" stroke-width="2" opacity="0.6"/>
    <line x1="145" y1="230" x2="104" y2="228" stroke="#111" stroke-width="2" opacity="0.6"/>
    <!-- Whiskers right -->
    <line x1="199" y1="226" x2="239" y2="218" stroke="#111" stroke-width="2" opacity="0.6"/>
    <line x1="199" y1="230" x2="240" y2="228" stroke="#111" stroke-width="2" opacity="0.6"/>

    <!-- ═══ COCKROACH (right) - menacing front view ═══ -->
    <!-- Rear legs (behind body) -->
    <path d="M 310 305 L 278 320 L 268 338" stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 368 305 L 400 320 L 410 338" stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Mid legs -->
    <path d="M 303 278 L 272 272" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 375 278 L 406 272" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <!-- Front legs -->
    <path d="M 308 250 L 280 235 L 270 220" stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 370 250 L 398 235 L 408 220" stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Main body (oval) -->
    <ellipse cx="339" cy="288" rx="45" ry="70" transform="rotate(4,339,288)" fill="#d4d4d4" stroke="#111" stroke-width="5"/>
    <!-- Body segments -->
    <path d="M 298 270 Q 339 265 380 270" stroke="#111" stroke-width="2.5" fill="none"/>
    <path d="M 296 300 Q 339 295 382 300" stroke="#111" stroke-width="2.5" fill="none"/>
    <path d="M 298 328 Q 339 323 380 328" stroke="#111" stroke-width="2.5" fill="none"/>
    <!-- Pronotum (shield over thorax) -->
    <ellipse cx="339" cy="228" rx="40" ry="26" fill="#c0c0c0" stroke="#111" stroke-width="5"/>
    <!-- Head -->
    <ellipse cx="339" cy="196" rx="34" ry="26" fill="#c8c8c8" stroke="#111" stroke-width="5"/>
    <!-- Antennae -->
    <path d="M 322 182 Q 298 155 275 138" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 356 182 Q 380 155 403 138" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="275" cy="138" r="5" fill="#111"/>
    <circle cx="403" cy="138" r="5" fill="#111"/>
    <!-- Left bulging eye -->
    <circle cx="320" cy="192" r="18" fill="white" stroke="#111" stroke-width="4"/>
    <circle cx="320" cy="192" r="11" fill="#111"/>
    <circle cx="315" cy="187" r="4" fill="white"/>
    <!-- Right bulging eye -->
    <circle cx="358" cy="192" r="18" fill="white" stroke="#111" stroke-width="4"/>
    <circle cx="358" cy="192" r="11" fill="#111"/>
    <circle cx="353" cy="187" r="4" fill="white"/>
    <!-- Menacing brows -->
    <path d="M 303 177 Q 318 171 328 179" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 375 177 Q 360 171 350 179" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Mandibles / grin -->
    <path d="M 319 212 Q 339 224 359 212" stroke="#111" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Teeth -->
    <rect x="325" y="212" width="10" height="13" rx="2" fill="white" stroke="#111" stroke-width="2.5"/>
    <rect x="339" y="212" width="10" height="13" rx="2" fill="white" stroke="#111" stroke-width="2.5"/>

  </g><!-- end characters clip -->

  <!-- ── RING BORDERS (drawn on top of characters) ── -->
  <circle cx="250" cy="232" r="148" fill="none" stroke="#111" stroke-width="11"/>
  <circle cx="250" cy="232" r="188" fill="none" stroke="#111" stroke-width="11"/>
  <!-- Outer badge border (redraw to be crisp on top) -->
  <circle cx="250" cy="232" r="204" fill="none" stroke="#111" stroke-width="14"/>

  <!-- ── TOP TEXT: ALLO ── -->
  <text font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
        font-weight="900" font-size="72" fill="#111" letter-spacing="6"
        stroke="white" stroke-width="4" paint-order="stroke">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ALLO</textPath>
  </text>

  <!-- ── BOTTOM TEXT: NUISIBLE ── -->
  <text font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
        font-weight="900" font-size="54" fill="#111" letter-spacing="4"
        stroke="white" stroke-width="4" paint-order="stroke">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">NUISIBLE</textPath>
  </text>

  <!-- ── TAGLINE: CHASSEURS DE NUISIBLES (centered below badge) ── -->
  <text x="250" y="492"
        font-family="'Arial', 'Helvetica', sans-serif"
        font-weight="700" font-size="18" fill="#111" letter-spacing="3"
        text-anchor="middle">CHASSEURS DE NUISIBLES</text>
</svg>
